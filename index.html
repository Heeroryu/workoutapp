<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161a">
<title>Log. — Workout Logger</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-180.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Log.">
</head>
<body>
<div id="app">
  <header class="hd">
    <div class="hd-row">
      <h1 class="hd-title">Log<span class="hd-dot">.</span></h1>
      <input type="date" id="dateInput" class="hd-date" aria-label="Session date">
    </div>
    <p class="today" id="todayLine"></p>
    <div class="phase" role="group" aria-label="Training phase">
      <button class="phase-btn" data-phase="0">Ease in</button>
      <button class="phase-btn" data-phase="1">Ramp up</button>
      <button class="phase-btn" data-phase="2">Full plan</button>
    </div>
    <p class="phase-note" id="phaseNote"></p>
  </header>

  <nav class="days" role="tablist" aria-label="Training day">
    <button class="day-btn" role="tab" data-day="upperA"><span class="day-wd">Mon</span>Upper A</button>
    <button class="day-btn" role="tab" data-day="lowerA"><span class="day-wd">Tue</span>Lower A</button>
    <button class="day-btn" role="tab" data-day="upperB"><span class="day-wd">Thu</span>Upper B</button>
    <button class="day-btn" role="tab" data-day="lowerB"><span class="day-wd">Fri</span>Lower B</button>
  </nav>

  <main id="sheet" class="sheet" aria-live="polite"></main>

  <footer class="ft">
    <div class="ft-bw">
      <label for="bwInput">Bodyweight</label>
      <input type="number" id="bwInput" inputmode="decimal" placeholder="—" step="0.1">
      <span class="ft-unit">lb</span>
    </div>
    <div class="ft-actions">
      <button id="restBtn" class="btn btn-rest">Rest</button>
      <button id="chartsBtn" class="btn btn-ghost">Charts</button>
      <button id="historyBtn" class="btn btn-ghost">History</button>
      <button id="exportBtn" class="btn btn-ghost">Export</button>
    </div>
    <p class="ft-status" id="status">Ready</p>
  </footer>

  <div id="restBar" class="rt" hidden>
    <div class="rt-row">
      <div class="rt-left">
        <span class="rt-label" id="restLabel">Rest</span>
        <span class="rt-time" id="restTime">0:45</span>
      </div>
      <div class="rt-actions">
        <button id="restPlus" class="btn btn-ghost">+15s</button>
        <button id="restSkip" class="btn btn-ghost">Skip</button>
      </div>
    </div>
    <div class="rt-chips" id="restChips" role="group" aria-label="Rest duration">
      <button class="rt-chip" data-sec="30">30s</button>
      <button class="rt-chip" data-sec="45">45s</button>
      <button class="rt-chip" data-sec="60">1:00</button>
      <button class="rt-chip" data-sec="90">1:30</button>
      <button class="rt-chip" data-sec="150">2:30</button>
    </div>
  </div>

  <input type="file" id="importFile" accept=".json,application/json" hidden>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-hd">
        <h2 id="modalTitle" class="modal-title">History</h2>
        <button id="modalClose" class="btn btn-ghost">Close</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>
</div>

<style>
  html, body { margin: 0; padding: 0; background: #12161a; }

  #app {
    --iron: #12161a;
    --steel: #1b2228;
    --edge: #2b343c;
    --chalk: #e9eef2;
    --dust: #7e8b96;
    --signal: #f5c518;
    --beat: #45c08a;
    --display: "Helvetica Neue Condensed", "HelveticaNeue-CondensedBold", "Arial Narrow", "Roboto Condensed", "Liberation Sans Narrow", system-ui, sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --num: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

    background: var(--iron);
    color: var(--chalk);
    font-family: var(--body);
    min-height: 100vh;
    max-width: 560px;
    margin: 0 auto;
    padding: 0 0 96px;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
  }
  #app *, #app *::before, #app *::after { box-sizing: border-box; }

  /* ---------- header ---------- */
  .hd { padding: 20px 16px 12px; border-bottom: 1px solid var(--edge); }
  .hd-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .hd-title {
    font-family: var(--display);
    font-size: 34px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; margin: 0; line-height: 1;
  }
  .hd-dot { color: var(--signal); }
  .hd-date {
    background: var(--steel); color: var(--chalk); border: 1px solid var(--edge);
    border-radius: 6px; padding: 7px 9px; font-family: var(--num); font-size: 13px;
  }
  .today {
    font-family: var(--display); text-transform: uppercase; letter-spacing: 0.06em;
    font-size: 15px; margin: 12px 0 0; color: var(--signal);
  }
  .today.rest-day { color: var(--dust); }
  .phase { display: flex; gap: 6px; margin-top: 14px; }
  .phase-btn {
    flex: 1; background: var(--steel); color: var(--dust);
    border: 1px solid var(--edge); border-radius: 6px;
    padding: 8px 4px; font-family: var(--display); font-size: 13px;
    letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .phase-btn[aria-pressed="true"] { color: var(--iron); background: var(--signal); border-color: var(--signal); font-weight: 700; }
  .phase-note { color: var(--dust); font-size: 12.5px; line-height: 1.45; margin: 10px 0 0; }

  /* ---------- day tabs ---------- */
  .days { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--edge); }
  .day-btn {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--dust); font-family: var(--display); text-transform: uppercase;
    letter-spacing: 0.07em; font-size: 13px; padding: 10px 2px 12px; cursor: pointer;
  }
  .day-wd { display: block; font-size: 9px; letter-spacing: 0.14em; opacity: .65; margin-bottom: 2px; }
  .day-btn[aria-selected="true"] { color: var(--chalk); border-bottom-color: var(--signal); }

  /* ---------- exercise cards ---------- */
  .sheet { padding: 8px 12px 0; }
  .ex { border-bottom: 1px solid var(--edge); padding: 16px 4px; }
  .ex-hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .ex-name {
    font-family: var(--display); font-size: 18px; letter-spacing: 0.03em;
    text-transform: uppercase; margin: 0; line-height: 1.15;
  }
  .ex-target { color: var(--dust); font-size: 12px; font-family: var(--num); margin: 4px 0 0; }
  .ex-hint {
    color: var(--beat); font-size: 12px; font-family: var(--num);
    font-weight: 600; margin: 4px 0 0;
  }
  .ex-demo {
    color: var(--dust); font-size: 11px; text-decoration: none;
    border: 1px solid var(--edge); border-radius: 4px; padding: 4px 7px;
    white-space: nowrap; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .ex-demo:hover, .ex-demo:focus-visible { color: var(--signal); border-color: var(--signal); }

  .sets { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
  .set {
    display: grid; grid-template-columns: 22px 1fr 1fr 74px;
    align-items: center; gap: 8px;
  }
  .set-n { font-family: var(--num); font-size: 12px; color: var(--dust); }
  .set input {
    width: 100%; background: var(--steel); border: 1px solid var(--edge);
    color: var(--chalk); border-radius: 6px; padding: 11px 10px;
    font-family: var(--num); font-size: 16px; text-align: center;
  }
  .set input::placeholder { color: #55606a; }
  .set input:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; border-color: var(--signal); }
  .set-last {
    font-family: var(--num); font-size: 11.5px; color: var(--dust);
    text-align: right; letter-spacing: -0.02em;
  }
  .set-last.beat { color: var(--beat); }
  .set-hdr { color: var(--dust); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; text-align: center; }

  /* ---------- footer ---------- */
  .ft {
    position: fixed; bottom: 0; left: 0; right: 0; max-width: 560px; margin: 0 auto;
    background: var(--steel); border-top: 1px solid var(--edge);
    padding: 10px 14px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .ft-bw { display: flex; align-items: center; gap: 7px; }
  .ft-bw label { font-size: 11px; color: var(--dust); text-transform: uppercase; letter-spacing: 0.08em; }
  .ft-bw input {
    width: 68px; background: var(--iron); border: 1px solid var(--edge); color: var(--chalk);
    border-radius: 6px; padding: 7px; font-family: var(--num); font-size: 14px; text-align: center;
  }
  .ft-unit { font-family: var(--num); font-size: 11px; color: var(--dust); }
  .ft-actions { margin-left: auto; display: flex; gap: 8px; }
  .btn {
    font-family: var(--display); text-transform: uppercase; letter-spacing: 0.08em;
    font-size: 12px; padding: 9px 13px; border-radius: 6px; cursor: pointer;
  }
  .btn-ghost { background: none; border: 1px solid var(--edge); color: var(--dust); }
  .btn-ghost:hover, .btn-ghost:focus-visible { color: var(--chalk); border-color: var(--dust); }
  .ft-status { flex-basis: 100%; margin: 0; font-family: var(--num); font-size: 10.5px; color: var(--dust); }

  /* ---------- rest timer ---------- */
  .rt {
    position: fixed; bottom: 96px; left: 0; right: 0; max-width: 560px; margin: 0 auto;
    background: var(--steel); border: 1px solid var(--signal); border-radius: 10px;
    padding: 10px 14px; display: flex; flex-direction: column; gap: 10px;
    z-index: 15; box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  .rt[hidden] { display: none; }
  .rt-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .rt-chips { display: flex; gap: 6px; }
  .rt-chip {
    flex: 1; background: var(--iron); color: var(--dust);
    border: 1px solid var(--edge); border-radius: 6px;
    padding: 7px 2px; font-family: var(--num); font-size: 12px; cursor: pointer;
  }
  .rt-chip[aria-pressed="true"] { color: var(--iron); background: var(--signal); border-color: var(--signal); font-weight: 700; }
  .btn-rest { background: var(--signal); border: 1px solid var(--signal); color: var(--iron); font-weight: 700; }
  .rt-left { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .rt-label {
    font-family: var(--display); text-transform: uppercase; letter-spacing: 0.08em;
    font-size: 11px; color: var(--dust); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rt-time { font-family: var(--num); font-size: 26px; font-weight: 600; color: var(--signal); line-height: 1; }
  .rt.done { border-color: var(--beat); }
  .rt.done .rt-time { color: var(--beat); }
  .rt-actions { display: flex; gap: 8px; flex-shrink: 0; }

  /* ---------- modal ---------- */
  .modal { position: fixed; inset: 0; background: rgba(6,9,11,.82); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .modal[hidden] { display: none; }   /* must beat the .modal display:flex above */
  .modal-box { background: var(--steel); border: 1px solid var(--edge); border-radius: 12px 12px 0 0; width: 100%; max-width: 560px; max-height: 82vh; display: flex; flex-direction: column; }
  .modal-hd { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--edge); }
  .modal-title { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.07em; font-size: 16px; margin: 0; }
  .modal-body { overflow-y: auto; padding: 14px 16px 24px; }
  .h-day { border-bottom: 1px solid var(--edge); padding: 12px 0; }
  .h-day h3 { font-family: var(--display); text-transform: uppercase; font-size: 14px; letter-spacing: 0.06em; margin: 0 0 6px; }
  .h-line { font-family: var(--num); font-size: 12px; color: var(--dust); line-height: 1.7; }
  .h-line b { color: var(--chalk); font-weight: 500; }
  .empty { color: var(--dust); font-size: 13px; line-height: 1.5; }
  .export-area {
    width: 100%; height: 240px; background: var(--iron); color: var(--chalk);
    border: 1px solid var(--edge); border-radius: 6px; padding: 10px;
    font-family: var(--num); font-size: 11px;
  }
  .chart { width: 100%; height: auto; display: block; background: var(--iron); border: 1px solid var(--edge); border-radius: 8px; }
  .chart-grid { stroke: var(--edge); stroke-width: 1; }
  .chart-txt { fill: var(--dust); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 9px; }
  .chart-last { font-size: 11px; font-weight: 700; }
  .chart-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart-title { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.07em; font-size: 13px; margin: 18px 0 8px; }
  .chart-title:first-child { margin-top: 0; }
  .chart-caption { font-family: var(--num); font-size: 11.5px; color: var(--chalk); margin: 6px 0 0; }
  .chart-select {
    width: 100%; background: var(--steel); color: var(--chalk); border: 1px solid var(--edge);
    border-radius: 6px; padding: 9px 10px; font-family: var(--body); font-size: 14px; margin-bottom: 8px;
  }
  .backup-row { display: flex; gap: 8px; margin-top: 10px; }
  .backup-row .btn { flex: 1; }
  .backup-note { color: var(--dust); font-size: 11.5px; line-height: 1.5; margin: 10px 0 0; }

  @media (prefers-reduced-motion: reduce) { #app * { transition: none !important; } }
</style>

<script>
(function () {
  var PHASES = [
    { label: "Weeks 1–2", cap: 2, note: "Your first 2 weeks back: 2 sets per exercise, stop 3–4 reps short of failure. It will feel too easy — that is the point after a year off." },
    { label: "Weeks 3–4", cap: null, note: "Weeks 3–4: full sets, stop 2–3 reps short of failure." },
    { label: "Week 5+", cap: null, note: "Week 5 and on: full sets, last set of each exercise goes to 1–2 reps short of failure." }
  ];

  // Mon=1 … Sun=0 → which workout the calendar says today is
  var SCHEDULE = { 1: "upperA", 2: "lowerA", 4: "upperB", 5: "lowerB" };
  var DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

  var PLAN = {
    upperA: { name: "Upper A", ex: [
      ["Incline dumbbell press", 3, "6–10", 150],
      ["Chest-supported row", 3, "8–12", 150],
      ["Lat pulldown", 3, "10–12", 120],
      ["Seated dumbbell shoulder press", 3, "8–10", 150],
      ["Dumbbell lateral raise", 3, "12–20", 90],
      ["EZ bar curl", 2, "8–12", 90],
      ["Triceps pushdown", 2, "10–15", 90]
    ]},
    lowerA: { name: "Lower A", ex: [
      ["Back squat", 3, "6–10", 180],
      ["Romanian deadlift", 3, "8–12", 150],
      ["Leg press", 3, "10–15", 120],
      ["Seated leg curl", 3, "10–15", 90],
      ["Standing calf raise", 3, "10–15", 90],
      ["Hanging knee raise", 3, "10–15", 90]
    ]},
    upperB: { name: "Upper B", ex: [
      ["Flat dumbbell press", 3, "8–12", 150],
      ["Pull-up (assisted ok)", 3, "6–10", 150],
      ["Bent-over row", 3, "8–12", 150],
      ["Dumbbell lateral raise", 3, "12–20", 90],
      ["Reverse pec deck", 3, "12–20", 90],
      ["Incline dumbbell curl", 2, "8–12", 90],
      ["Overhead cable extension", 2, "10–15", 90]
    ]},
    lowerB: { name: "Lower B", ex: [
      ["Bulgarian split squat", 3, "8–12 ea", 150],
      ["Hack squat or leg press", 3, "10–15", 120],
      ["Lying leg curl", 3, "10–15", 90],
      ["Leg extension", 3, "12–15", 90],
      ["Seated calf raise", 3, "12–20", 90],
      ["Plank", 3, "30–60s", 90]
    ]}
  };

  var KEY_SESSIONS = "wl:sessions";
  var KEY_PREFS = "wl:prefs";
  var state = { sessions: {}, prefs: { phase: 0, day: "upperA", rest: 45 }, date: today(), dirty: false };
  var saveTimer = null;

  function today() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  // Parse "YYYY-MM-DD" as a LOCAL date (new Date(str) would treat it as UTC
  // and give the wrong weekday in the evening in US time zones).
  function weekdayOf(dateStr) {
    var p = dateStr.split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).getDay();
  }

  function applySchedule() {
    var wd = weekdayOf(state.date);
    var sched = SCHEDULE[wd];
    var line = $("todayLine");
    if (sched) {
      state.prefs.day = sched;
      line.textContent = DAY_NAMES[wd] + " — " + PLAN[sched].name + " day";
      line.classList.remove("rest-day");
    } else {
      line.textContent = DAY_NAMES[wd] + " — rest day · just walk (7–10k steps)";
      line.classList.add("rest-day");
    }
  }
  function $(id) { return document.getElementById(id); }
  function status(msg) { $("status").textContent = msg; }
  function sessionKey() { return state.date + "|" + state.prefs.day; }

  /* ---------- storage ----------
     localStorage, with an in-memory fallback if the browser blocks it
     (private mode, or file:// under some browsers). */
  var mem = {};
  var store = (function () {
    try {
      var probe = "wl:probe";
      window.localStorage.setItem(probe, "1");
      window.localStorage.removeItem(probe);
      return {
        ok: true,
        get: function (k) { return window.localStorage.getItem(k); },
        set: function (k, v) { window.localStorage.setItem(k, v); }
      };
    } catch (e) {
      return {
        ok: false,
        get: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
        set: function (k, v) { mem[k] = v; }
      };
    }
  })();

  function loadAll() {
    try {
      var r = store.get(KEY_SESSIONS);
      if (r) state.sessions = JSON.parse(r) || {};
    } catch (e) { state.sessions = {}; }
    try {
      var p = store.get(KEY_PREFS);
      if (p) {
        var parsed = JSON.parse(p);
        if (parsed && typeof parsed === "object") {
          if (PHASES[parsed.phase]) state.prefs.phase = Number(parsed.phase);
          if (PLAN[parsed.day]) state.prefs.day = parsed.day;
          if (parsed.rest > 0) state.prefs.rest = Number(parsed.rest);
        }
      }
    } catch (e) { /* keep defaults */ }

    if (!store.ok) { status("Storage blocked by browser — this session only. Use Export before you close."); return; }
    var n = countLogged();
    status(n ? "Loaded " + n + " logged session" + (n === 1 ? "" : "s") : "Ready");
  }

  function countLogged() {
    return Object.keys(state.sessions).filter(hasData).length;
  }
  function hasData(k) {
    var s = state.sessions[k];
    if (!s) return false;
    if (s.bw) return true;
    return Object.keys(s.ex || {}).some(function (n) { return (s.ex[n] || []).some(nonEmpty); });
  }

  function queueSave() {
    state.dirty = true;
    status("Saving…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveAll, 700);
  }

  function saveAll() {
    clearTimeout(saveTimer);
    if (!state.dirty) return;
    // Drop sessions that were merely visited but never filled in.
    var clean = {};
    Object.keys(state.sessions).forEach(function (k) {
      if (hasData(k)) clean[k] = state.sessions[k];
    });
    try {
      store.set(KEY_SESSIONS, JSON.stringify(clean));
      store.set(KEY_PREFS, JSON.stringify(state.prefs));
      state.dirty = false;
      status(store.ok
        ? "Saved " + new Date().toLocaleTimeString()
        : "Held in memory only — Export before closing");
    } catch (e) {
      status("Save failed — use Export to copy your numbers out");
    }
  }

  /* ---------- data helpers ---------- */
  function getSession() {
    var k = sessionKey();
    if (!state.sessions[k]) state.sessions[k] = { day: state.prefs.day, date: state.date, ex: {}, bw: "" };
    return state.sessions[k];
  }

  function lastFor(exName) {
    var best = null;
    Object.keys(state.sessions).forEach(function (k) {
      var s = state.sessions[k];
      if (s.day !== state.prefs.day) return;
      if (s.date >= state.date) return;
      if (!s.ex[exName] || !s.ex[exName].some(nonEmpty)) return;
      if (!best || s.date > best.date) best = s;
    });
    return best ? best.ex[exName] : null;
  }
  function nonEmpty(row) { return row && (row.w !== "" && row.w != null || row.r !== "" && row.r != null); }

  function setCount(defSets) {
    var cap = PHASES[state.prefs.phase].cap;
    return cap ? Math.min(defSets, cap) : defSets;
  }

  // Progression rule from the plan: top of the rep range on ALL sets last
  // time → add weight this time (5 lb upper body, 10 lb lower body).
  function progressionHint(exName, repsSpec) {
    if (/s$/.test(repsSpec)) return null;               // time-based (plank) — no weight hint
    var top = parseInt(repsSpec.split("–").pop(), 10);  // "8–12" → 12
    if (!top) return null;
    var last = lastFor(exName);
    if (!last) return null;
    var rows = last.filter(nonEmpty);
    if (!rows.length) return null;
    var allTopped = rows.every(function (x) {
      return x.w !== "" && x.r !== "" && parseFloat(x.r) >= top;
    });
    if (!allTopped) return null;
    return state.prefs.day.indexOf("upper") === 0 ? "Add 5 lb today" : "Add 10 lb today";
  }

  /* ---------- rest timer ---------- */
  var rest = { end: 0, tick: null, hideTimer: null };

  function fmtTime(s) { return Math.floor(s / 60) + ":" + pad(s % 60); }

  function startRest(exName) {
    clearInterval(rest.tick);
    clearTimeout(rest.hideTimer);
    rest.end = Date.now() + state.prefs.rest * 1000;
    var bar = $("restBar");
    bar.classList.remove("done");
    $("restLabel").textContent = exName ? "Rest — " + exName : "Rest";
    bar.hidden = false;
    syncChips();
    restTick();
    rest.tick = setInterval(restTick, 250);
  }

  function syncChips() {
    Array.prototype.forEach.call(document.querySelectorAll(".rt-chip"), function (c) {
      c.setAttribute("aria-pressed", String(Number(c.dataset.sec) === state.prefs.rest));
    });
  }

  function restTick() {
    var left = Math.ceil((rest.end - Date.now()) / 1000);
    if (left > 0) { $("restTime").textContent = fmtTime(left); return; }
    clearInterval(rest.tick);
    $("restTime").textContent = "GO";
    $("restBar").classList.add("done");
    beep();
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    rest.hideTimer = setTimeout(hideRest, 5000);
  }

  function hideRest() {
    clearInterval(rest.tick);
    clearTimeout(rest.hideTimer);
    $("restBar").hidden = true;
  }

  var audioCtx = null;
  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      [0, 0.35, 0.7].forEach(function (t) {
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.type = "sine"; o.frequency.value = 880;
        g.gain.setValueAtTime(0.001, audioCtx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.25);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.3);
      });
    } catch (e) { /* audio blocked — vibration/visual still fire */ }
  }

  /* ---------- render ---------- */
  function render() {
    var day = PLAN[state.prefs.day];
    var sess = getSession();
    var wrap = $("sheet");
    wrap.innerHTML = "";

    day.ex.forEach(function (item) {
      var name = item[0], defSets = item[1], reps = item[2];
      var n = setCount(defSets);
      var last = lastFor(name);
      if (!sess.ex[name]) sess.ex[name] = [];

      var card = document.createElement("section");
      card.className = "ex";

      var hd = document.createElement("div");
      hd.className = "ex-hd";
      var left = document.createElement("div");
      var h = document.createElement("h2");
      h.className = "ex-name"; h.textContent = name;
      var t = document.createElement("p");
      t.className = "ex-target"; t.textContent = n + " × " + reps;
      left.appendChild(h); left.appendChild(t);
      var hint = progressionHint(name, reps);
      if (hint) {
        var hp = document.createElement("p");
        hp.className = "ex-hint"; hp.textContent = "↑ " + hint;
        left.appendChild(hp);
      }
      var demo = document.createElement("a");
      demo.className = "ex-demo";
      demo.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(name + " form tutorial");
      demo.target = "_blank"; demo.rel = "noopener noreferrer";
      demo.textContent = "Demo";
      hd.appendChild(left); hd.appendChild(demo);
      card.appendChild(hd);

      var sets = document.createElement("div");
      sets.className = "sets";

      var hdr = document.createElement("div");
      hdr.className = "set";
      hdr.innerHTML = '<span></span><span class="set-hdr">Weight</span><span class="set-hdr">Reps</span><span class="set-hdr" style="text-align:right">Last</span>';
      sets.appendChild(hdr);

      for (var i = 0; i < n; i++) {
        (function (idx) {
          if (!sess.ex[name][idx]) sess.ex[name][idx] = { w: "", r: "" };
          var row = sess.ex[name][idx];

          var el = document.createElement("div");
          el.className = "set";

          var num = document.createElement("span");
          num.className = "set-n"; num.textContent = idx + 1;

          var w = document.createElement("input");
          w.type = "number"; w.inputMode = "decimal"; w.placeholder = "lb";
          w.value = row.w; w.setAttribute("aria-label", name + " set " + (idx + 1) + " weight");

          var r = document.createElement("input");
          r.type = "number"; r.inputMode = "numeric"; r.placeholder = "reps";
          r.value = row.r; r.setAttribute("aria-label", name + " set " + (idx + 1) + " reps");

          var lastEl = document.createElement("span");
          lastEl.className = "set-last";
          var lr = last && last[idx];
          lastEl.textContent = lr && (lr.w || lr.r) ? (lr.w || "—") + " × " + (lr.r || "—") : "—";

          function mark() {
            var beat = lr && lr.w && lr.r && row.w && row.r &&
              (parseFloat(row.w) > parseFloat(lr.w) ||
               (parseFloat(row.w) === parseFloat(lr.w) && parseFloat(row.r) > parseFloat(lr.r)));
            lastEl.classList.toggle("beat", !!beat);
          }
          mark();

          w.addEventListener("input", function () { row.w = w.value; mark(); queueSave(); });
          r.addEventListener("input", function () { row.r = r.value; mark(); queueSave(); });
          // Set done (reps committed) → start the rest countdown.
          r.addEventListener("change", function () {
            if (r.value !== "") startRest(name);
          });

          el.appendChild(num); el.appendChild(w); el.appendChild(r); el.appendChild(lastEl);
          sets.appendChild(el);
        })(i);
      }

      card.appendChild(sets);
      wrap.appendChild(card);
    });

    $("bwInput").value = sess.bw || "";
    $("phaseNote").textContent = PHASES[state.prefs.phase].note;

    Array.prototype.forEach.call(document.querySelectorAll(".phase-btn"), function (b) {
      b.setAttribute("aria-pressed", String(Number(b.dataset.phase) === state.prefs.phase));
    });
    Array.prototype.forEach.call(document.querySelectorAll(".day-btn"), function (b) {
      b.setAttribute("aria-selected", String(b.dataset.day === state.prefs.day));
    });
  }

  /* ---------- history & export ---------- */
  function openModal(title, node) {
    $("modalTitle").textContent = title;
    $("modalBody").innerHTML = "";
    $("modalBody").appendChild(node);
    $("modal").hidden = false;
  }
  function closeModal() { $("modal").hidden = true; }

  function showHistory() {
    var keys = Object.keys(state.sessions).filter(function (k) {
      var s = state.sessions[k];
      return Object.keys(s.ex || {}).some(function (n) { return s.ex[n].some(nonEmpty); });
    }).sort().reverse();

    var box = document.createElement("div");
    if (!keys.length) {
      box.className = "empty";
      box.textContent = "Nothing logged yet. Enter a weight and reps on any set and it will appear here.";
      openModal("History", box);
      return;
    }
    keys.slice(0, 40).forEach(function (k) {
      var s = state.sessions[k];
      var d = document.createElement("div");
      d.className = "h-day";
      var h = document.createElement("h3");
      h.textContent = s.date + " · " + (PLAN[s.day] ? PLAN[s.day].name : s.day) + (s.bw ? " · " + s.bw + " lb" : "");
      d.appendChild(h);
      Object.keys(s.ex).forEach(function (n) {
        var rows = s.ex[n].filter(nonEmpty);
        if (!rows.length) return;
        var p = document.createElement("div");
        p.className = "h-line";
        var b = document.createElement("b");
        b.textContent = n;
        p.appendChild(b);
        p.appendChild(document.createTextNode(" — " + rows.map(function (x) {
          return (x.w || "—") + "×" + (x.r || "—");
        }).join(", ")));
        d.appendChild(p);
      });
      box.appendChild(d);
    });
    openModal("History", box);
  }

  function showExport() {
    var lines = [];
    Object.keys(state.sessions).sort().forEach(function (k) {
      var s = state.sessions[k];
      var body = [];
      Object.keys(s.ex).forEach(function (n) {
        var rows = s.ex[n].filter(nonEmpty);
        if (rows.length) body.push("  " + n + ": " + rows.map(function (x) { return (x.w || "—") + "x" + (x.r || "—"); }).join(", "));
      });
      if (body.length) {
        lines.push(s.date + "  " + (PLAN[s.day] ? PLAN[s.day].name : s.day) + (s.bw ? "  [" + s.bw + " lb]" : ""));
        lines.push(body.join("\n"));
        lines.push("");
      }
    });
    var box = document.createElement("div");
    var ta = document.createElement("textarea");
    ta.className = "export-area";
    ta.readOnly = true;
    ta.value = lines.length ? lines.join("\n") : "Nothing logged yet.";
    box.appendChild(ta);

    var row = document.createElement("div");
    row.className = "backup-row";
    var dl = document.createElement("button");
    dl.className = "btn btn-ghost"; dl.textContent = "Download backup";
    dl.addEventListener("click", downloadBackup);
    var imp = document.createElement("button");
    imp.className = "btn btn-ghost"; imp.textContent = "Import backup";
    imp.addEventListener("click", function () { $("importFile").click(); });
    row.appendChild(dl); row.appendChild(imp);
    box.appendChild(row);
    var note = document.createElement("p");
    note.className = "backup-note";
    note.textContent = "Backup is a file with all your logged sessions. Import it on a new phone (or after clearing the browser) to get your history back.";
    box.appendChild(note);

    openModal("Export", box);
    setTimeout(function () { ta.focus(); ta.select(); }, 50);
  }

  function downloadBackup() {
    var payload = { app: "workout-logger", exported: new Date().toISOString(), sessions: state.sessions };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "workout-backup-" + today() + ".json";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  function importBackup(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        var sessions = data && data.sessions ? data.sessions : data; // accept raw sessions too
        if (!sessions || typeof sessions !== "object" || Array.isArray(sessions)) throw new Error("bad shape");
        var added = 0;
        Object.keys(sessions).forEach(function (k) {
          var s = sessions[k];
          if (!s || !s.date || !s.day || typeof s.ex !== "object") return; // skip junk
          if (!state.sessions[k]) added++;
          state.sessions[k] = s; // imported wins on conflict
        });
        state.dirty = true;
        saveAll();
        render();
        status("Imported " + added + " new session(s) — " + countLogged() + " total");
        $("modal").hidden = true;
      } catch (e) {
        status("Import failed — that file is not a workout backup");
      }
    };
    reader.readAsText(file);
  }

  /* ---------- charts ---------- */
  var SVGNS = "http://www.w3.org/2000/svg";

  // Single-series line chart. points: [{date:"YYYY-MM-DD", value:Number}] sorted by date.
  function lineChart(points, color, unit) {
    var W = 320, H = 150, PAD = { t: 14, r: 12, b: 20, l: 34 };
    var svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("class", "chart");

    var vals = points.map(function (p) { return p.value; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (lo === hi) { lo -= 5; hi += 5; }                    // flat line → give it air
    var span = hi - lo; lo -= span * 0.1; hi += span * 0.1;

    var iw = W - PAD.l - PAD.r, ih = H - PAD.t - PAD.b;
    function x(i) { return points.length === 1 ? PAD.l + iw / 2 : PAD.l + (i / (points.length - 1)) * iw; }
    function y(v) { return PAD.t + (1 - (v - lo) / (hi - lo)) * ih; }

    function txt(s, tx, ty, anchor) {
      var t = document.createElementNS(SVGNS, "text");
      t.setAttribute("x", tx); t.setAttribute("y", ty);
      t.setAttribute("class", "chart-txt");
      if (anchor) t.setAttribute("text-anchor", anchor);
      t.textContent = s;
      return t;
    }

    // 3 recessive gridlines + y labels
    [0, 0.5, 1].forEach(function (f) {
      var gy = PAD.t + f * ih;
      var ln = document.createElementNS(SVGNS, "line");
      ln.setAttribute("x1", PAD.l); ln.setAttribute("x2", W - PAD.r);
      ln.setAttribute("y1", gy); ln.setAttribute("y2", gy);
      ln.setAttribute("class", "chart-grid");
      svg.appendChild(ln);
      svg.appendChild(txt(Math.round(hi - f * (hi - lo)), PAD.l - 5, gy + 3, "end"));
    });

    // first / last date labels
    function shortDate(d) { return Number(d.slice(5, 7)) + "/" + Number(d.slice(8, 10)); }
    svg.appendChild(txt(shortDate(points[0].date), PAD.l, H - 6, "start"));
    if (points.length > 1) svg.appendChild(txt(shortDate(points[points.length - 1].date), W - PAD.r, H - 6, "end"));

    // the line
    if (points.length > 1) {
      var pl = document.createElementNS(SVGNS, "polyline");
      pl.setAttribute("points", points.map(function (p, i) { return x(i) + "," + y(p.value); }).join(" "));
      pl.setAttribute("class", "chart-line");
      pl.setAttribute("stroke", color);
      svg.appendChild(pl);
    }

    // dots with a caption readout on tap/hover (touch-friendly tooltip)
    var caption = document.createElement("p");
    caption.className = "chart-caption";
    var lastP = points[points.length - 1];
    function setCaption(p) { caption.textContent = p.date + " · " + p.value + " " + unit; }
    setCaption(lastP);

    points.forEach(function (p, i) {
      var dot = document.createElementNS(SVGNS, "circle");
      dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(p.value));
      dot.setAttribute("r", points.length > 20 ? 2.5 : 4);
      dot.setAttribute("fill", color);
      var hit = document.createElementNS(SVGNS, "circle");   // bigger invisible hit target
      hit.setAttribute("cx", x(i)); hit.setAttribute("cy", y(p.value));
      hit.setAttribute("r", 11); hit.setAttribute("fill", "transparent");
      hit.style.cursor = "pointer";
      ["click", "mouseenter"].forEach(function (ev) {
        hit.addEventListener(ev, function () { setCaption(p); });
      });
      svg.appendChild(dot); svg.appendChild(hit);
    });

    // direct label on the last point
    var ll = txt(lastP.value, Math.min(x(points.length - 1) + 6, W - PAD.r), y(lastP.value) - 7, "start");
    ll.setAttribute("class", "chart-txt chart-last");
    ll.setAttribute("fill", color);
    svg.appendChild(ll);

    var wrap = document.createElement("div");
    wrap.appendChild(svg);
    wrap.appendChild(caption);
    return wrap;
  }

  function bwPoints() {
    var byDate = {};
    Object.keys(state.sessions).forEach(function (k) {
      var s = state.sessions[k];
      if (s.bw && !isNaN(parseFloat(s.bw))) byDate[s.date] = parseFloat(s.bw);
    });
    return Object.keys(byDate).sort().map(function (d) { return { date: d, value: byDate[d] }; });
  }

  function bestSetPoints(exName) {
    var byDate = {};
    Object.keys(state.sessions).forEach(function (k) {
      var s = state.sessions[k];
      if (!s.ex[exName]) return;
      var best = null;
      s.ex[exName].filter(nonEmpty).forEach(function (row) {
        var w = parseFloat(row.w);
        if (!isNaN(w) && (best === null || w > best)) best = w;
      });
      if (best !== null) byDate[s.date] = Math.max(byDate[s.date] || 0, best);
    });
    return Object.keys(byDate).sort().map(function (d) { return { date: d, value: byDate[d] }; });
  }

  function allExerciseNames() {
    var seen = {}, names = [];
    Object.keys(PLAN).forEach(function (d) {
      PLAN[d].ex.forEach(function (item) {
        if (!seen[item[0]]) { seen[item[0]] = 1; names.push(item[0]); }
      });
    });
    return names;
  }

  function showCharts() {
    var box = document.createElement("div");

    function section(title) {
      var h = document.createElement("h3");
      h.className = "chart-title"; h.textContent = title;
      box.appendChild(h);
    }
    function emptyNote(msg) {
      var p = document.createElement("p");
      p.className = "empty"; p.textContent = msg;
      box.appendChild(p);
    }

    section("Bodyweight (lb)");
    var bw = bwPoints();
    if (bw.length) box.appendChild(lineChart(bw, "#45c08a", "lb"));
    else emptyNote("No bodyweight logged yet — type it in the bottom bar on any session.");

    section("Best set (lb)");
    var sel = document.createElement("select");
    sel.className = "chart-select";
    allExerciseNames().forEach(function (n) {
      var o = document.createElement("option");
      o.value = n; o.textContent = n;
      sel.appendChild(o);
    });
    box.appendChild(sel);
    var holder = document.createElement("div");
    box.appendChild(holder);

    function drawExercise() {
      holder.innerHTML = "";
      var pts = bestSetPoints(sel.value);
      if (pts.length) holder.appendChild(lineChart(pts, "#f5c518", "lb"));
      else {
        var p = document.createElement("p");
        p.className = "empty"; p.textContent = "Nothing logged for this exercise yet.";
        holder.appendChild(p);
      }
    }
    sel.addEventListener("change", drawExercise);
    // default to the first exercise that actually has data
    var names = allExerciseNames();
    for (var i = 0; i < names.length; i++) {
      if (bestSetPoints(names[i]).length) { sel.value = names[i]; break; }
    }
    drawExercise();

    openModal("Charts", box);
  }

  /* ---------- wiring ---------- */
  Array.prototype.forEach.call(document.querySelectorAll(".phase-btn"), function (b) {
    b.addEventListener("click", function () {
      state.prefs.phase = Number(b.dataset.phase);
      render(); queueSave();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".day-btn"), function (b) {
    b.addEventListener("click", function () {
      state.prefs.day = b.dataset.day;
      render(); queueSave();
    });
  });
  $("dateInput").addEventListener("change", function (e) {
    state.date = e.target.value || today();
    applySchedule();
    render();
  });
  $("bwInput").addEventListener("input", function (e) {
    getSession().bw = e.target.value; queueSave();
  });
  $("restPlus").addEventListener("click", function () {
    var base = Math.max(rest.end, Date.now());
    rest.end = base + 15000;
    var bar = $("restBar");
    if (bar.classList.contains("done")) {   // "GO" showing → restart the countdown
      clearTimeout(rest.hideTimer);
      bar.classList.remove("done");
      clearInterval(rest.tick);
      rest.tick = setInterval(restTick, 250);
    }
    restTick();
  });
  $("restSkip").addEventListener("click", hideRest);
  $("restBtn").addEventListener("click", function () { startRest(""); });
  Array.prototype.forEach.call(document.querySelectorAll(".rt-chip"), function (c) {
    c.addEventListener("click", function () {
      state.prefs.rest = Number(c.dataset.sec);
      queueSave();
      startRest($("restLabel").textContent.replace(/^Rest( — )?/, ""));
    });
  });
  $("chartsBtn").addEventListener("click", showCharts);
  $("historyBtn").addEventListener("click", showHistory);
  $("exportBtn").addEventListener("click", showExport);
  $("importFile").addEventListener("change", function (e) {
    if (e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
    e.target.value = "";
  });
  $("modalClose").addEventListener("click", closeModal);
  $("modal").addEventListener("click", function (e) { if (e.target === $("modal")) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

  // Flush the debounced save if the tab is closed or backgrounded mid-typing.
  window.addEventListener("beforeunload", saveAll);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") saveAll();
  });

  loadAll();
  $("dateInput").value = state.date;
  applySchedule();
  render();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(function () { /* offline mode unavailable — app still works */ });
  }
})();
</script>
</body>
</html>
